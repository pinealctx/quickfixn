[DEFAULT]
# Message persistence - ensures all messages can be recovered after failures
PersistMessages=Y
FileStoreSync=Y
FileStorePath=store
FileLogPath=log
FileLogHeartbeats=N
FileLogSync=Y

# Sequence number management - ensures message sequence integrity 
RefreshOnLogon=Y
ResetOnLogon=N
ResetOnLogout=N
ResetOnDisconnect=N
CheckLatency=Y
MaxLatency=60
ValidateSequenceNumbers=Y
RequiresOrigSendingTime=Y

# Connection and recovery settings
ReconnectInterval=5
ConnectionType=initiator
StartTime=00:00:00
EndTime=00:00:00
UseDataDictionary=Y
DataDictionary=FIX44.xml
BeginString=FIX.4.4
HeartBtInt=20
SocketConnectHost=fix2-dev.xsyphon.com

# Advanced reliability features
SendRedundantResendRequests=Y
ResendSessionLevelRejects=Y
EnableLastMsgSeqNumProcessed=Y
SendLogoutBeforeTimeoutDisconnect=Y

[SESSION]
SenderCompID=T131
TargetCompID=XCD449
SocketConnectPort=9299